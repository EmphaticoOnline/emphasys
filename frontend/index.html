<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Título de la aplicación -->
    <title>__BRAND_TITLE__</title>

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon clásico -->
    <link rel="icon" href="__BRAND_FAVICON__" />

    <!-- PNG favicon para navegadores modernos -->
    <link rel="icon" type="image/png" sizes="32x32" href="__BRAND_ICON_32__" />

    <!-- Android / PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="__BRAND_ICON_192__" />

    <!-- Apple -->
    <link rel="apple-touch-icon" href="__BRAND_APPLE_TOUCH_ICON__" />

    <!-- PWA: manifest + color de tema del navegador/barra de estado -->
    <link rel="manifest" href="__BRAND_MANIFEST__" />
    <meta name="theme-color" content="__BRAND_THEME_COLOR__" />

    <!-- Instalación en Android/Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS/Safari: requerido para que "Agregar a pantalla de inicio" se
         comporte como app instalada (modo standalone), condición
         indispensable para que las notificaciones push funcionen en
         iPhone. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="__BRAND_SHORT_NAME__" />

  </head>

  <body>
    <div id="root"></div>

    <!-- React App -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
