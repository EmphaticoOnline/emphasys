<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Propuesta B</title>
<style>
  @font-face { font-family: "AvCond"; font-weight: 800; src: local("AvenirNextCondensed-Heavy"); }
  @font-face { font-family: "AvCond"; font-weight: 700; src: local("AvenirNextCondensed-Bold"); }
  :root {
    --navy: #1d2f68;
    --teal: #006261;
    --teal-soft: #80b1b0;
    --paper: #f6f7f9;
    --line: #dfe3ea;
    --muted: #5a6585;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--paper); }
  .ad {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: var(--paper); color: var(--navy);
    font-family: "Avenir Next", "Helvetica Neue", sans-serif;
  }
  .frame { position: absolute; inset: 72px 72px 64px; display: flex; flex-direction: column; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .top img { width: 216px; height: auto; display: block; }
  .tag {
    margin-top: 14px; font-size: 19px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
    color: var(--teal); text-align: right; line-height: 1.5;
  }

  .headline {
    margin-top: 76px;
    font-family: "AvCond", "Avenir Next Condensed", sans-serif; font-weight: 800;
    text-transform: uppercase; white-space: nowrap; letter-spacing: -1px;
  }
  .headline .l1, .headline .l3 { display: block; font-size: 90px; line-height: 1; }
  .headline .l2 { display: block; font-size: 158px; line-height: .92; color: var(--teal); margin: 4px 0 6px -4px; letter-spacing: -2px; }

  /* Franja de datos: barras conocidas + una barra "desconocida" */
  .insight { position: relative; margin-top: 64px; height: 150px; }
  .insight svg { display: block; }

  .bottom { margin-top: auto; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 30px; }
  .sub { font-size: 32px; line-height: 1.3; color: var(--muted); white-space: nowrap; padding-top: 26px; border-top: 2px solid var(--line); }
  .sub b { color: var(--navy); font-weight: 700; }
    .cta {
    display: flex; align-items: center; gap: 16px;
    background: var(--navy); color: #fff; border-radius: 999px;
    padding: 22px 30px 22px 34px; font-size: 29px; font-weight: 700; white-space: nowrap;
  }
  .cta .arrow { width: 40px; height: 40px; border-radius: 50%; background: var(--teal); display: grid; place-items: center; }
  .note { font-size: 19px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--teal); padding-right: 6px; }

  .accent { position: absolute; left: 0; top: 0; width: 1080px; height: 10px;
    background: linear-gradient(90deg, var(--navy) 0 70%, var(--teal) 70% 100%); }
</style>
<script>
  // Ajusta las dos primeras líneas del titular al ancho exacto de la columna
  addEventListener('DOMContentLoaded', () => {
    const W = document.querySelector('.headline').clientWidth;
    const fit = el => { const fs = parseFloat(getComputedStyle(el).fontSize); el.style.display='inline-block';
      el.style.fontSize = (fs * W / el.getBoundingClientRect().width) + 'px'; el.style.display='block'; return parseFloat(el.style.fontSize); };
    const f1 = fit(document.querySelector('.l1'));
    fit(document.querySelector('.l2'));
    document.querySelector('.l3').style.fontSize = f1 + 'px';
  });
</script>
</head>
<body>
<div class="ad">
  <div class="accent"></div>
  <div class="frame">
    <div class="top">
      <img src="assets/logo-emphasys.png" alt="Emphasys Soluciones">
      <div class="tag">Evaluación<br>empresarial</div>
    </div>

    <h1 class="headline">
      <span class="l1">¿Cuánto te está costando</span>
      <span class="l2">lo que no sabes</span>
      <span class="l3">de tu empresa?</span>
    </h1>

    <div class="insight">
      <svg width="936" height="150" viewBox="0 0 936 150" xmlns="http://www.w3.org/2000/svg" font-family="Avenir Next, sans-serif">
        <line x1="0" y1="118" x2="936" y2="118" stroke="#dfe3ea" stroke-width="2"/>
        <line x1="0" y1="78" x2="936" y2="78" stroke="#dfe3ea" stroke-width="1" stroke-dasharray="2 6"/>
        <line x1="0" y1="38" x2="936" y2="38" stroke="#dfe3ea" stroke-width="1" stroke-dasharray="2 6"/>
        <!-- barras conocidas -->
        <g fill="#1d2f68" opacity=".9">
          <rect x="20" y="62" width="76" height="56" rx="3"/>
          <rect x="137" y="44" width="76" height="74" rx="3"/>
          <rect x="254" y="72" width="76" height="46" rx="3"/>
          <rect x="371" y="30" width="76" height="88" rx="3"/>
          <rect x="488" y="54" width="76" height="64" rx="3"/>
        </g>
        <!-- barras desconocidas -->
        <g fill="none" stroke="#006261" stroke-width="2.5" stroke-dasharray="7 6">
          <rect x="605" y="10" width="76" height="108" rx="3"/>
          <rect x="722" y="10" width="76" height="108" rx="3"/>
          <rect x="839" y="10" width="76" height="108" rx="3"/>
        </g>
        <g fill="#006261" font-size="40" font-weight="700" text-anchor="middle">
          <text x="643" y="79">?</text>
          <text x="760" y="79">?</text>
          <text x="877" y="79">?</text>
        </g>
        <g font-size="14" font-weight="600" letter-spacing="1.2" text-anchor="middle">
          <text x="58" y="142" fill="#8a93ab">VENTAS</text>
          <text x="175" y="142" fill="#8a93ab">COMPRAS</text>
          <text x="292" y="142" fill="#8a93ab">INVENTARIO</text>
          <text x="409" y="142" fill="#8a93ab">COBRANZA</text>
          <text x="526" y="142" fill="#8a93ab">GASTOS</text>
          <text x="643" y="142" fill="#006261">MÁRGENES</text>
          <text x="760" y="142" fill="#006261">PROCESOS</text>
          <text x="877" y="142" fill="#006261">RENTABILIDAD</text>
        </g>
      </svg>
    </div>

    <div class="bottom">
      <p class="sub">Descúbrelo con nuestra <b>Evaluación Empresarial en 4&nbsp;Minutos.</b></p>
      <div class="row">
        <div class="cta">Evalúa tu empresa en 4 minutos
          <span class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </div>
        <div class="note">Gratis · Sin registro</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
