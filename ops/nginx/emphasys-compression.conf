# Instalar como /etc/nginx/conf.d/emphasys-compression.conf y recargar Nginx.
# Nginx 1.18 comprime también las respuestas proxied de Express.
# `gzip on` ya existe en /etc/nginx/nginx.conf; no se repite aquí.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml;
